apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:<github-org>/<gitops-repo>.git
    targetRevision: main
    path: auth-backend/auth-backend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: myproject
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
