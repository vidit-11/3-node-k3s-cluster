name: auth-backend
namespace: myproject

replicaCount: 1
revisionHistoryLimit: 2
minReadySeconds: 25
terminationGracePeriodSeconds: 60

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

image:
  repository: <dockerhub-namespace>/auth-backend
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub-cred

containerPort: 8080

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 5
  failureThreshold: 36        # up to 3 min for Spring Boot to start

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 20

preStopSleepSeconds: 20

service:
  type: ClusterIP
  port: 80
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/actuator/prometheus"

resources: {}

infisical:
  enabled: true
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  projectSlug: <infisical-project-slug>
  envSlug: dev
  secretsPath: /auth-backend
  credentialsSecret: infisical-universal-auth
