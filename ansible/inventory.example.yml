# Copy to inventory.yml and fill in the <...> values.
k3s_cluster:
  children:
    server:
      hosts:
        k3s-1:
          ansible_host: 192.168.1.10   # i7 / 32 GB, runs cluster-init
        k3s-2:
          ansible_host: 192.168.1.11   # i5 / 16 GB
        k3s-3:
          ansible_host: 192.168.1.12   # i5 / 16 GB
  vars:
    ansible_user: <ssh-user>
    ansible_port: 22
    ansible_become_exe: sudo.ws        # Ubuntu 26.04 ships sudo-rs, which Ansible can't drive

    k3s_version: v1.33.5+k3s1

    # ansible-vault encrypt_string "$(openssl rand -hex 32)" --name token
    token: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      <ciphertext>

    api_endpoint: 192.168.1.10
    extra_server_args: >-
      --node-ip={{ ansible_host }}
      --tls-san=192.168.1.10
      --tls-san=<PUBLIC_STATIC_IP>
